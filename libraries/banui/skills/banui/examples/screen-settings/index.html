<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки</title>
  <meta name="banui:group" content="screen">
  <meta name="banui:signs" content="все пять">
  <meta name="banui:note" content="Окно настроек: три раздела, поля с проверкой, списки, переключатели и капля состояния.">
  <meta name="banui:added" content="2026-11-12">
  <link rel="stylesheet" href="../../kit/banui.css">
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <main class="ban">
    <div class="col">
      <div class="win" role="group" aria-label="Настройки">
        <div class="win-title">Настройки</div>
        <div class="ban-drop"></div>
        <div class="win-nav">
          <div class="ban-nav" role="tablist" aria-label="Разделы">
            <button type="button" role="tab" id="tab-general" aria-controls="pan-general" aria-selected="true" tabindex="0">Общие</button>
            <button type="button" role="tab" id="tab-sound" aria-controls="pan-sound" aria-selected="false" tabindex="-1">Звук</button>
            <button type="button" role="tab" id="tab-about" aria-controls="pan-about" aria-selected="false" tabindex="-1">О программе</button>
          </div>
        </div>
        <div class="win-panels">
          <div role="tabpanel" id="pan-general" aria-labelledby="tab-general">
            <div class="row">
              <label class="row-label" for="name">Имя</label>
              <input class="ban-field" id="name" name="name" value="Анна" aria-label="Имя" autocomplete="off" spellcheck="false">
            </div>
            <div class="row">
              <label class="row-label" for="mail">Почта</label>
              <input class="ban-field" id="mail" name="mail" value="anna@mail.ru" aria-label="Почта" autocomplete="off" spellcheck="false">
            </div>
            <div class="row">
              <span class="row-label">Язык</span>
              <select class="ban-select" name="lang" aria-label="Язык">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="es">Español</option>
              </select>
            </div>
            <div class="row">
              <label class="row-label" for="autostart">Запускать при входе</label>
              <button class="ban-toggle" id="autostart" type="button" role="switch" aria-checked="true" tabindex="0"></button>
            </div>
            <div class="row">
              <label class="row-label" for="updates">Проверять обновления</label>
              <button class="ban-toggle" id="updates" type="button" role="switch" aria-checked="false" tabindex="0"></button>
            </div>
          </div>
          <div role="tabpanel" id="pan-sound" aria-labelledby="tab-sound" hidden inert>
            <div class="row">
              <span class="row-label">Микрофон</span>
              <select class="ban-select" name="mic" aria-label="Микрофон">
                <option value="built-in">Встроенный</option>
                <option value="headset">Гарнитура</option>
                <option value="usb">Внешний USB</option>
              </select>
            </div>
            <div class="row">
              <label class="row-label" for="notify-sound">Звук уведомлений</label>
              <button class="ban-toggle" id="notify-sound" type="button" role="switch" aria-checked="true" tabindex="0"></button>
            </div>
            <div class="row">
              <label class="row-label" for="rec-sound">Звук при записи</label>
              <button class="ban-toggle" id="rec-sound" type="button" role="switch" aria-checked="false" tabindex="0"></button>
            </div>
          </div>
          <div role="tabpanel" id="pan-about" aria-labelledby="tab-about" hidden inert>
            <div class="row">
              <span class="row-label">Версия</span>
              <span class="row-end">
                <span class="row-value">1.0.2</span>
                <button class="ban-button" name="check" type="button" tabindex="0">Проверить</button>
              </span>
            </div>
            <div class="row">
              <span class="row-label">Лицензия</span>
              <span class="row-value">Личная</span>
            </div>
          </div>
        </div>
      </div>
      <p id="after">Настройки никуда не сохраняются.</p>
    </div>
  </main>

  <script type="module" src="./settings.js"></script>
</body>
</html>
